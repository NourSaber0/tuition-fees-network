spring.application.name=demo
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.type.preferred_string_jdbc_type=LONGVARCHAR

# Disable demo seeder during automated regression tests to maintain test isolation
app.demo-seeder.enabled=false

# Disable background scheduled jobs during test suites to preserve isolation
app.reconciliation.scheduler.enabled=false

