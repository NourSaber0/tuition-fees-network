spring.application.name=demo
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.type.preferred_string_jdbc_type=LONGVARCHAR

# Enable demo data seeding for standalone runs
app.demo-seeder.enabled=true

# Reconciliation Scheduler (6-hour automated batch cycle: 00:00, 06:00, 12:00, 18:00)
app.reconciliation.scheduler.enabled=true
app.reconciliation.cron=0 0 */6 * * *

# Mock Bank settings
mockbank.api.url=http://localhost:8000/api/v1
mockbank.api.key=wit-intern-2026
